services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_API_PORT: 18080
      RAG_USE_LLM: ${RAG_USE_LLM:-false}
      LLM_API_BASE: ${LLM_API_BASE:-http://192.168.27.250:18003/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.6-27B}
      LLM_API_KEY: ${LLM_API_KEY:-qwen-local-key}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_SEND_CHAT_TEMPLATE_KWARGS: ${LLM_SEND_CHAT_TEMPLATE_KWARGS:-true}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-deepseek}
      LLM_FALLBACK_API_BASE: ${LLM_FALLBACK_API_BASE:-https://api.deepseek.com}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deepseek-v4-flash}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_FALLBACK_TIMEOUT_SECONDS: ${LLM_FALLBACK_TIMEOUT_SECONDS:-45}
      LLM_FALLBACK_MAX_TOKENS: ${LLM_FALLBACK_MAX_TOKENS:-512}
      LLM_FALLBACK_SEND_CHAT_TEMPLATE_KWARGS: ${LLM_FALLBACK_SEND_CHAT_TEMPLATE_KWARGS:-false}
      LLM_FALLBACK_SEND_THINKING_PARAM: ${LLM_FALLBACK_SEND_THINKING_PARAM:-true}
      LLM_FALLBACK_ENABLE_THINKING: ${LLM_FALLBACK_ENABLE_THINKING:-false}
      AUTO_LOAD_DEMO_KNOWLEDGE: ${AUTO_LOAD_DEMO_KNOWLEDGE:-true}
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 18080"
    ports:
      - "18080:18080"
    depends_on:
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  frontend_node_modules:
